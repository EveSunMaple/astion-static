name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Needed by Astro content sync (Notion loader). Add these as repository
      # secrets to run typecheck/build in CI; forks and PRs without secrets
      # automatically skip those steps below.
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Astro typecheck (skipped without Notion secrets)
        if: env.NOTION_TOKEN != ''
        run: pnpm check

      - name: Biome check (lint + formatting) on src
        run: pnpm biome:check

      - name: Biome formatting check on src (no write)
        run: pnpm biome:format -- ./src --write=false

      - name: Unit tests
        run: pnpm test

      - name: Production build (skipped without Notion secrets)
        if: env.NOTION_TOKEN != ''
        run: pnpm build

      - name: Notice when Notion secrets are missing
        if: env.NOTION_TOKEN == ''
        run: echo "::notice::NOTION_TOKEN / NOTION_DATA_SOURCE_ID secrets are not set - skipping typecheck and build. See docs/deploy-and-schedule.zh-CN.md"
