packages:
  - "."

allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  sharp: true

peerDependencyRules:
  allowedVersions:
    astro: "^7.0.0"

overrides:
  astro: "^7.2.0"
  tar: "^7.5.21"
  svgo: "^3.3.4"
  undici: "^7.29.0"
  postcss: "^8.5.23"
  nanoid: "^3.3.17"
  sharp: "^0.35.3"
  immutable: "^5.1.8"
  fast-uri: "^3.1.5"
  "picomatch@2": "2.3.2"
  "picomatch@4": "4.0.4"
  # security patches for transitive dependencies (pnpm audit --prod)
  "axios@>=1.0.0 <1.12.0": "^1.12.0"
  "brace-expansion@>=2.0.0 <2.1.2": "^2.1.2"
  "form-data@>=4.0.0 <4.0.4": "^4.0.4"
  "glob@>=10.2.0 <10.5.0": "^10.5.0"
  "minimatch@>=9.0.0 <9.0.6": "^9.0.6"
  "serialize-javascript@<7.0.3": "^7.1.2"
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"

auditConfig:
  ignoreGhsas:
    # No patched release exists on npm yet (advisory claims versions that were never published).
    - GHSA-vfj7-8cjw-p6xm # braces: stack-exhaustion DoS
    - GHSA-jmr9-qjv8-65gv # extract-zip: symlink path traversal
    - GHSA-7pqw-9j4j-h8q3 # extract-zip: arbitrary file write via symlinks
    # Build-time only dependency (@playform/compress). The DoS requires merging a
    # recursive object graph from untrusted input, which does not happen here.
    - GHSA-ggr8-5vv4-36mx # deepmerge-ts: stack exhaustion

onlyBuiltDependencies:
  - esbuild
  - "@parcel/watcher"
  - sharp
